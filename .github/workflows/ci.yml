name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/alert-notify/index.ts

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration in order
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stubs.sql
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            # pg_net is Supabase-managed; the stubs provide net.http_post.
            sed 's/^create extension if not exists pg_net.*$//' "$f" | psql -v ON_ERROR_STOP=1 -q
          done

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sketch: [fermentation_monitor_v1, fermentation_tilt_v1]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install OneWire DallasTemperature
      - run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/${{ matrix.sketch }}
